<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Student Registration Form</title>

	<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
	<div class="form-card">
		<h1>Student Registration</h1>
		<p class="subtitle">Please fill in your details below.</p>
		<form>
			<!--Personal Information-->
			<h3>Personal Information</h3>
			<div class="form-group">
				<label for="name">Full Name</label>
				<input type="text" id="name" name="student_name" placeholder="Enter your full name" required>
			</div>
			<div class="form-group">
				<label for="email">Email Address</label>
				<input type="email" id="email" name="email" placeholder="Enter your email" required>
			</div>
			<div class="form-group">
				<label for="password">Password</label>
				<input type="password" id="password" name="password" placeholder="Enter your password" required>
			</div>
			<!--Gender-->
			<h3>Gender</h3>
			<div class="options">
				<label>
					<input type="radio" name="gender" value="male">
					Male
				</label>
				<label>
					<input type="radio" name="gender" value="female">
					Female
				</label>
				<label>
					<input type="radio" name="gender" value="other">
					Other
				</label>
			</div>
			<!--Programming Skills-->
			<h3>Programming Skills</h3>
			<div class="options">
				<label>
					<input type="checkbox" name="skills" value="python">
					Python
				</label>
				<label>
					<input type="checkbox" name="skills" value="java">
					Java
				</label>
				<label>
					<input type="checkbox" name="skills" value="c">
					C
				</label>
				<label>
					<input type="checkbox" name="skills" value="cpp">
					C++
				</label>
			</div>
			<!--Buttons-->
			<div class="buttons">
				<button type="submit">Register</button>
				<button type="reset" class="reset-btn">Reset</button>
			</div>
		</form>
	</div>
</div>
</body>
</html>
